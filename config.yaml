# AAA 05 — orquestração integrada. Não substitua data/jarvis.db ao atualizar.
autonomy:
  compact_prompt: true
  max_model_rounds: 14

lm_studio:
  base_url: "http://127.0.0.1:1234/v1"
  model: "auto"  # usa o primeiro modelo carregado
  temperature: 0.2
  context_length: 8192  # janela configurada no LM Studio
  max_tokens: 900  # mantém o limite anterior; ajustaremos por modelo depois
model_management:
  enabled: true
  default_model: "gpt_oss"  # qwen ou gpt_oss; seleção fixa nesta etapa
  timeout_seconds: 180
speech:
  sample_rate: 16000
  whisper_model: "small"  # exige cache/download inicial; alternativa: base
  whisper_device: "cpu"  # CUDA requer bibliotecas compatíveis instaladas
  whisper_compute_type: "int8"
  language: "pt"
  silence_seconds: 5
  minimum_seconds: 0.45
  maximum_seconds: 55
  energy_threshold: 0.016
wake:
  enabled: true
  phrase: "jarvis"
  # Wake via Whisper: fala curta seguida de silêncio (sem Vosk)
  silence_seconds: 0.7
  minimum_seconds: 0.3
  maximum_seconds: 3.0
  hotkey: "f9"
conversation:
  intent_routing_enabled: false  # 14.1.1: decisão semântica do LLM; ferramentas aplicam segurança
  enabled: true
  timeout_seconds: 240
  dual_channel_enabled: true
  dual_channel_format: plain  # 13.3.1: evita tags no GPT-OSS; structured e experimental
  dual_channel_debug_preview: true
  speech_semantic_enabled: false  # Etapa 14.1.3: sem segunda inferência; SpeechTextProcessor determinístico
  speech_semantic_max_tokens: 320
  speech_semantic_max_chars: 650  # 13.4.1: limite da fala conversacional
  # Comandos explícitos reconhecidos depois da transcrição do Whisper.
  end_phrases:
    - "pode descansar"
    - "jarvis pode descansar"
    - "encerre a conversa"
    - "encerrar conversa"
    - "voltar ao modo de espera"
    - "modo de espera"
    - "ate logo jarvis"
voice:
  enabled: true
  provider: "kokoro" # altere para "legacy" para usar SAPI/Piper
  kokoro:
    voice: "pm_santa"
    speed: 1.0
    use_cache: false
    timeout_seconds: 120
    tts_stream_mode: "sentence"
    speech_realization_enabled: true
    sentence_safety_chars: 650
    max_chunk_chars: 260
    preload_on_start: true
  piper_executable: ""  # opcional: caminho para piper.exe
  piper_model: ""       # opcional: caminho para voz .onnx
paths:
  allowed_roots:
    - "~/Videos"
    - "~/Documents"
    - "~/Downloads"
    - "D:/"
  max_search_results: 12
security:
  confirm_writes: true
  confirm_program_launch: false

# Etapa 5: busca direta em disco, sem banco ou indice persistente
file_search:
  mode: "realtime"
  timeout_seconds: 30
  min_score: 35
document_reading:
  max_chars: 12000
  max_pages: 12
  max_file_mb: 20

# Etapa 15: desligar para retornar às ferramentas anteriores.
skills:
  enabled: true
